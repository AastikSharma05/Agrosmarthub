          </ul>
        </div>
        </section>

        <section id="content">
            <div id="header">
                <div class="header-nav">
                    <div class="menu-button"><!--<i class="fa fa-navicon"></i>--></div>
                    <div class="nav">
                        <ul>
                            <li class="nav-profile">
                                <div class="nav-profile-image">
                                    <img
                                        src="../images/desktop-wallpaper-anime-profile-pic-anime-profile.jpg"
                                        alt="profile-img"
                                        alt="profile image"
                                    />
                                    <div class="nav-profile-name">
                                        Aastik Sharma<i class="fa fa-caret-down"></i>
                                    </div>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="content">
                <div class="content-header">
                    <h1>Hi Farmer</h1>
                    <p>Welcome Back!!</p>
                </div>
               
                <!-- Write here div -->
                <div id="input">
                    <div id="transaction">
                        <div id="calculator">
                            <div id="income"></div>
                            <div id="expense"></div>
                            <div id="balance"></div>
                        </div>
                        
                    <div id="form-holder">
                        <form id="income-form">
                            <label for="date">DATE:</label>
                            <input type="date" name="date"id="dateIncome"required>
                            <label for="Transaction Type">Transaction Type:</label>
                            <select name="type" id="type">
                                <option value="INCOME">INCOME</option>
                                <option value="EXPENSE">EXPENSE</option>
                            </select></br>
                            <label for="Description">Description:</label>
                            <input type="text" name="description" id="desc">
                            <label for="Amount">Amount:</label></br>
                            <input type="number" name="amount" id="amountIncome" required></br>
                            <input type="submit" value="Submit" id="btnIncome">
            
                        </form>
                    </div>
                    <!-- <div id="appendTransaction">
                        <h2>Transaction History</h2>
                        
                    </div> -->
                    <div id="appendTransaction">
                        <h2>Transaction History</h2>
                        <table id="transaction-table">
                          <thead>
                            <tr>
                              <th>Date</th>
                              <th>Transaction Type</th>
                              <th>Description</th>
                              <th>Amount</th>
                            </tr>
                          </thead>
                          <tbody id="transaction-data">
                            <!-- Dynamically fetched data will be populated here -->
                          </tbody>
                        </table>
                      </div>
                      
                   
            
                    </div> 
                </div>
